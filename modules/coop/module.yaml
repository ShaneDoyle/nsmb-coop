id: Coop
name: NSMB Co-op
description: Adds co-op multiplayer support to the game.

authors:
  - TheGameratorT
  - Shadey21

repo: https://github.com/ShaneDoyle/nsmb-coop/

# a target can be: arm7, arm7(ov), arm9, arm9(ov)
targets:
  - arm9:
      - includes:
          - "include"
      - sources:
          - "source9/**"


# The assets this module puts in the ROM, laid out one directory per language.
# `en` underneath every build, so the eight other layers only have to carry what
# they actually translate.
nitrofs:
  dir: nitrofs
  layered: true
  base-variant: en

# TODO: Add many components and maybe organize better

# each component can be disabled by the parent modules.yaml file
# an enabled component will define its "defines"
# a disabled component will exclude its "sources" and "files"_
components:
  - Vanilla:
      target: arm9
      sources:
        - "source9/vanilla/*"
      files:
        - "z_new/coop/SE_VOC_MA_SHOT.nwav"
        - "z_new/coop/SE_VOC_LU_SHOT.nwav"
      objects:
        - name: "CoopFlagActor"
          type: "actor"
          header: "coop/actors/CoopFlagActor.hpp"
        - name: "CoopWorldUnlockSign"
          type: "actor"
          header: "coop/actors/CoopWorldUnlockSign.hpp"

  - DesyncGuard_Update_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_UPDATE_HOOK

  - DesyncGuard_SwitchScene_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_SWITCH_SCENE_HOOK

  - DesyncGuard_DamagePlayer_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_DAMAGE_PLAYER_HOOK

  - DesyncGuard_SwitchPowerup_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_SWITCH_POWERUP_HOOK

  - DesyncGuard_GivePlayerLife_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_GIVE_PLAYER_LIFE_HOOK

  - DesyncGuard_GetRandom_Hook:
      target: arm9
      defines: COOP_DESYNC_GUARD_GET_RANDOM_HOOK

  # Custom World Unlock

  - CustomWorldUnlock:
      target: arm9
      defines: COOP_CUSTOM_WORLD_UNLOCK
      sources:
        - "source9/actors/CoopWorldUnlockSign.cpp"
        - "source9/WorldUnlock.cpp"
      files:
        - "enemy/w3_sign.nsbmd"
        - "enemy/w6_sign.nsbmd"

  # Actors

  - EndingSceneFix:
      target: arm9
      sources: "source9/fixes/EndingScene.cpp"

  - WorldmapFix:
      target: arm9(8)
      sources: "source9/fixes/worldmap/*"

  - FlagpoleFix:
      target: arm9(12)
      sources: "source9/fixes/flagpole/*"

  - ThwompFix:
      target: arm9(24)
      sources: "source9/fixes/Thwomp.cpp"

  - WhompFix:
      target: arm9(34)
      sources: "source9/fixes/Whomp.cpp"

  - JumpingCheepCheepFix:
      target: arm9(50)
      sources: "source9/fixes/JumpingCheepCheep.cpp"

  - SpikeBassFix:
      target: arm9(58)
      defines:
        - COOP_FIX_SPIKE_BASS_ADD_ZONE_ID_FIELD=1
        - COOP_FIX_SPIKE_BASS_ZONE_ID_FIELD_OFFSET=0x4B8
      sources: "source9/fixes/SpikeBass.cpp"

  - SpikeBassSpawnerFix:
      target: arm9(58)
      requires: SpikeBassFix
      sources: "source9/fixes/SpikeBassSpawner.cpp"

  - UnagiEelFix:
