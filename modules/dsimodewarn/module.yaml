id: DSiModeWarn
name: DSi Mode Warning
description: Recommends the player to enable DSi CPU mode if the console supports it.

authors:
  - TheGameratorT

targets:
  - arm7:
      sources: "source7/*"
  - arm9:
      includes: "include"
      sources: "source9/*"

components:
  - DSiModeScene:
      target: arm9
      # source not specified because the scene can not be removed
      objects:
        - name: "DSiModeScene"
          type: "scene"
          header: "dsimodewarn/DSiModeScene.hpp"
